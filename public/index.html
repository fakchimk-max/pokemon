<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Team Builder</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-1: #10132a;
        --bg-2: #1a1f42;
        --panel: rgba(255, 255, 255, 0.045);
        --panel-solid: #1c2145;
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #eef0fb;
        --text-dim: #9aa1c7;
        --gold: #ffcc4d;
        --gold-dim: #4a3f22;
        --red: #ef4444;
        --radius-lg: 22px;
        --radius-md: 16px;
        --radius-sm: 10px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        --font-display: "Baloo 2", sans-serif;
        --font-body: "Inter", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: var(--font-body);
        color: var(--text);
        background:
            radial-gradient(circle at 15% -10%, rgba(239, 68, 68, 0.16), transparent 40%),
            radial-gradient(circle at 100% 0%, rgba(255, 204, 77, 0.12), transparent 45%),
            linear-gradient(180deg, var(--bg-1), var(--bg-2) 45%, var(--bg-1));
        min-height: 100vh;
        line-height: 1.5;
    }

    h1, h2, h3, h4, button, .team-count {
        font-family: var(--font-display);
    }

    /* ---------- Header ---------- */

    header {
        position: relative;
        padding: 42px 20px 46px;
        text-align: center;
        overflow: hidden;
        border-bottom: 1px solid var(--panel-border);
    }

    header::before {
        content: "";
        position: absolute;
        top: -90px;
        right: -70px;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: linear-gradient(180deg, var(--red) 48%, #f4f5f9 48%, #f4f5f9 55%, var(--red) 55%);
        opacity: 0.10;
    }

    header::after {
        content: "";
        position: absolute;
        top: -90px;
        right: -70px;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        border: 10px solid rgba(16, 19, 42, 0.4);
        box-sizing: border-box;
    }

    header h1 {
        margin: 0 0 8px;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 0.3px;
        color: var(--text);
        position: relative;
    }

    header p {
        margin: 0;
        color: var(--text-dim);
        font-size: 15px;
        position: relative;
    }

    /* ---------- Layout ---------- */

    .container {
        width: 92%;
        max-width: 1200px;
        margin: 28px auto 80px;
    }

    .panel {
        background: var(--panel-solid);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-lg);
        padding: 22px 24px;
        margin-bottom: 22px;
        box-shadow: var(--shadow);
    }

    .panel h2 {
        margin: 0 0 16px;
        font-size: 21px;
        font-weight: 700;
        color: var(--text);
    }

    .panel h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-dim);
        margin: 22px 0 12px;
    }

    /* ---------- Buttons ---------- */

    button {
        border: none;
        padding: 11px 18px;
        border-radius: 999px;
        cursor: pointer;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 14px;
        color: white;
        background: linear-gradient(135deg, #4b5178, #2f3358);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
    }

    button:active { transform: translateY(0); }

    button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 204, 77, 0.45);
    }

    .add-button { background: linear-gradient(135deg, #43a047, #2e7d32); }
    .save-button { background: linear-gradient(135deg, #2196f3, #1565c0); }
    .load-button { background: linear-gradient(135deg, #ab47bc, #6a1b9a); }
    .clear-button, .remove-button { background: linear-gradient(135deg, #ef5350, #c62828); }

    /* ---------- Selected Pokémon ---------- */

    .selected-box {
        position: relative;
        display: flex;
        align-items: center;
        gap: 28px;
        min-height: 220px;
        border-radius: var(--radius-md);
        padding: 26px;
        overflow: hidden;
        background: var(--card-bg, linear-gradient(135deg, #33395f, #20233f));
        isolation: isolate;
    }

    .selected-box::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(10, 12, 26, 0.15), rgba(10, 12, 26, 0.68));
        z-index: -1;
    }

    .selected-box img {
        width: 170px;
        height: 170px;
        object-fit: contain;
        filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.45));
    }

    .selected-info { flex: 1; }

    .selected-info h2 {
        font-size: 28px;
        text-transform: capitalize;
        margin: 0 0 12px;
        color: white;
    }

    .pokemon-type {
        display: inline-block;
        padding: 5px 13px;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(4px);
        border-radius: 999px;
        margin: 0 6px 6px 0;
        font-size: 13px;
        text-transform: capitalize;
        color: white;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 16px 0 18px;
    }

    .stat {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(4px);
        padding: 10px;
        border-radius: var(--radius-sm);
        text-align: center;
    }

    .stat strong {
        display: block;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.75);
        font-weight: 500;
    }

    .stat span {
        font-size: 19px;
        font-weight: 700;
        color: white;
        font-family: var(--font-display);
    }

    .selected-info .add-button { margin-top: 4px; margin-right: 10px; }

    /* ---------- Controls ---------- */

    .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .controls input, .controls select {
        padding: 11px 14px;
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-family: var(--font-body);
        background: #242a52;
        color: var(--text);
    }

    .controls input::placeholder { color: var(--text-dim); }

    .controls input:focus, .controls select:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 204, 77, 0.3);
    }

    .search-box { flex: 1; min-width: 200px; }

    /* ---------- Pokémon grid ---------- */

    .pokemon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
    }

    .pokemon-card {
        border-radius: var(--radius-md);
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        background: var(--panel-solid);
        border: 1px solid var(--panel-border);
    }

    .pokemon-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 14px 26px rgba(0, 0, 0, 0.4);
    }

    .card-top {
        background: var(--card-bg, linear-gradient(135deg, #454b78, #2b2f54));
        padding: 18px 10px 10px;
        text-align: center;
    }

    .card-top img {
        width: 110px;
        height: 110px;
        object-fit: contain;
        filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.4));
        transition: transform 0.2s ease;
    }

    .pokemon-card:hover .card-top img { transform: scale(1.06); }

    .card-info {
        background: rgba(9, 11, 24, 0.55);
        backdrop-filter: blur(6px);
        padding: 12px 14px 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-info h3 {
        margin: 2px 0 6px;
        font-size: 16px;
        text-transform: capitalize;
        color: white;
    }

    .pokemon-id {
        color: var(--text-dim);
        font-size: 12px;
        font-weight: 600;
    }

    .card-info .pokemon-type {
        padding: 3px 10px;
        font-size: 11px;
        margin: 0 4px 4px 0;
    }

    /* ---------- Team ---------- */

    .team-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
    }

    .team-count {
        font-size: 17px;
        font-weight: 700;
        color: var(--gold);
    }

    .team-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

    .team-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 14px;
        margin-top: 4px;
    }

    .team-card {
        border-radius: var(--radius-md);
        overflow: hidden;
        border: 1px solid var(--panel-border);
        background: var(--panel-solid);
    }

    .team-card .card-top { padding: 14px 8px 6px; }

    .team-card img {
        width: 90px;
        height: 90px;
        object-fit: contain;
        filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4));
    }

    .team-card .card-info {
        text-align: center;
        padding: 10px 8px 12px;
    }

    .team-card h4 {
        margin: 0 0 4px;
        text-transform: capitalize;
        font-size: 14px;
        color: white;
    }

    .team-card .remove-button {
        margin-top: 8px;
        padding: 7px 14px;
        font-size: 12px;
    }

    /* ---------- Total stats ---------- */

    .total-stats {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
    }

    .total-stat {
        background: linear-gradient(160deg, #262c54, #171a35);
        border: 1px solid var(--panel-border);
        color: white;
        padding: 14px 8px;
        text-align: center;
        border-radius: var(--radius-sm);
    }

    .total-stat strong {
        display: block;
        font-size: 11px;
        color: var(--text-dim);
        font-weight: 500;
    }

    .total-stat span {
        font-size: 21px;
        font-weight: 700;
        color: var(--gold);
    }

    /* ---------- Team slots (fixed save slots) ---------- */

    .team-slots {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    .team-slot-card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-sm);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        text-align: center;
    }

    .team-slot-label {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 14px;
        color: var(--gold);
    }

    .team-slot-thumbs {
        display: flex;
        justify-content: center;
        min-height: 34px;
    }

    .team-slot-thumbs img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        background: #20244a;
        border-radius: 50%;
        border: 2px solid var(--panel-solid);
        margin-left: -10px;
    }

    .team-slot-thumbs img:first-child { margin-left: 0; }

    .team-slot-empty {
        font-size: 12px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
    }

    .team-slot-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
    }

    .btn-sm { padding: 7px 13px; font-size: 12px; }

    .team-slot-actions button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
    }

    .empty {
        color: var(--text-dim);
        text-align: center;
        padding: 20px;
        font-size: 14px;
    }

    /* ---------- Scroll to top ---------- */

    .scroll-top-btn {
        position: fixed;
        right: 26px;
        bottom: 26px;
        width: 52px;
        height: 52px;
        padding: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        background: linear-gradient(135deg, var(--gold), var(--red));
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 40;
    }

    .scroll-top-btn.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
    }

    .scroll-top-btn:hover { transform: translateY(-3px); }

    @media (max-width: 800px) {
        header h1 { font-size: 28px; }

        .selected-box {
            flex-direction: column;
            text-align: center;
        }

        .stats { grid-template-columns: repeat(2, 1fr); }

        .team-grid { grid-template-columns: repeat(3, 1fr); }

        .total-stats { grid-template-columns: repeat(3, 1fr); }

        .team-slots { grid-template-columns: repeat(2, 1fr); }

        .scroll-top-btn {
            right: 16px;
            bottom: 16px;
            width: 46px;
            height: 46px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Pokémon Team Builder</h1>
    <p>ค้นหาเปรียบเทียบค่าพลังและจัดทีม Pokémon ในฝันของคุณ</p>
</header>

<div class="container">

    <!-- ========================= -->
    <!-- Selected Pokémon -->
    <!-- ========================= -->

    <div class="panel">
        <h2>Pokémon ที่เลือก</h2>
        <div id="selectedPokemon" class="selected-box">
            <div class="empty">กรุณากดเลือก Pokémon ด้านล่าง</div>
        </div>
    </div>

    <!-- ========================= -->
    <!-- Team -->
    <!-- ========================= -->

    <div class="panel">
        <div class="team-header">
            <h2>ทีม Pokémon</h2>
            <div class="team-count"><span id="teamCount">0</span> / 6</div>
        </div>

        <div class="team-buttons">
            <button class="clear-button" onclick="clearTeam()">🗑️ ล้างทีมที่กำลังจัด</button>
        </div>

        <div id="teamGrid" class="team-grid">
            <div class="empty">ยังไม่มี Pokémon ในทีม</div>
        </div>

        <h3>รวมค่าพลังของทีม</h3>

        <div class="total-stats">
            <div class="total-stat"><strong>HP</strong><span id="totalHp">0</span></div>
            <div class="total-stat"><strong>Attack</strong><span id="totalAttack">0</span></div>
            <div class="total-stat"><strong>Defense</strong><span id="totalDefense">0</span></div>
            <div class="total-stat"><strong>Sp. Attack</strong><span id="totalSpecialAttack">0</span></div>
            <div class="total-stat"><strong>Sp. Defense</strong><span id="totalSpecialDefense">0</span></div>
            <div class="total-stat"><strong>Speed</strong><span id="totalSpeed">0</span></div>
        </div>

        <h3>ช่องเก็บทีม</h3>

        <div id="teamSlots" class="team-slots"></div>
    </div>

    <!-- ========================= -->
    <!-- Search / Type / Sort -->
    <!-- ========================= -->

    <div class="panel">
        <h2>เลือก Pokémon</h2>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="ค้นหาชื่อ Pokémon..." oninput="filterPokemons()">

            <select id="typeSelect" onchange="filterPokemons()">
                <option value="all">ทุกธาตุ</option>
                <option value="normal">Normal ⭐</option>
                <option value="fire">Fire 🔥</option>
                <option value="water">Water 💧</option>
                <option value="grass">Grass 🌿</option>
                <option value="electric">Electric ⚡</option>
                <option value="ice">Ice ❄️</option>
                <option value="fighting">Fighting 🥊</option>
                <option value="poison">Poison ☠️</option>
                <option value="ground">Ground 🌍</option>
                <option value="flying">Flying 🕊️</option>
                <option value="psychic">Psychic 🔮</option>
                <option value="bug">Bug 🐛</option>
                <option value="rock">Rock 🪨</option>
                <option value="ghost">Ghost 👻</option>
                <option value="dragon">Dragon 🐉</option>
                <option value="dark">Dark 🌑</option>
                <option value="steel">Steel ⚙️</option>
                <option value="fairy">Fairy ✨</option>
            </select>

            <select id="statSelect" onchange="sortPokemons()">
                <option value="id">เรียงตาม ID</option>
                <option value="hp">HP</option>
                <option value="attack">Attack</option>
                <option value="defense">Defense</option>
                <option value="specialAttack">Sp. Attack</option>
                <option value="specialDefense">Sp. Defense</option>
                <option value="speed">Speed</option>
            </select>

            <select id="orderSelect" onchange="sortPokemons()">
                <option value="desc">ค่าสูง → ต่ำ</option>
                <option value="asc">ค่าต่ำ → สูง</option>
            </select>
        </div>

        <div id="pokemonGrid" class="pokemon-grid"></div>
    </div>

</div>

<button id="scrollTopBtn" class="scroll-top-btn" onclick="scrollToTop()" aria-label="เลื่อนขึ้นด้านบน">↑</button>

<script>

// ========================================
// ธีมสีตามธาตุ (ใช้ทำพื้นหลังไล่สีของการ์ด)
// ========================================

const typeGradients = {
    normal:   ["#b8b6a4", "#8f8d75"],
    fire:     ["#ff7043", "#e05a2b"],
    water:    ["#4fc3f7", "#1565c0"],
    electric: ["#ffe066", "#f2a600"],
    grass:    ["#7bc96f", "#2e7d32"],
    ice:      ["#a7e8f5", "#4dd0e1"],
    fighting: ["#e0654f", "#a83218"],
    poison:   ["#c86fdc", "#6a1b9a"],
    ground:   ["#dcb27a", "#8d6e4a"],
    flying:   ["#9fc9ff", "#5c6bc0"],
    psychic:  ["#ff8fc7", "#c2185b"],
    bug:      ["#b6d94c", "#689f38"],
    rock:     ["#c2ac8e", "#6d4c41"],
    ghost:    ["#9a7ad1", "#4527a0"],
    dragon:   ["#8f7bff", "#3949ab"],
    dark:     ["#6b6b76", "#2b2b33"],
    steel:    ["#cfd8dc", "#78909c"],
    fairy:    ["#ffc1e3", "#e91e8c"]
};

function gradientForTypes(types) {

    const list = (types && types.length) ? types : ["normal"];

    const first = typeGradients[list[0]] || typeGradients.normal;
    const second = list[1]
        ? (typeGradients[list[1]] || typeGradients.normal)
        : first;

    return `linear-gradient(135deg, ${first[0]}, ${second[1]})`;
}

// ========================================
// ตัวแปร
// ========================================

let allPokemons = [];
let displayedPokemons = [];
let selectedPokemon = null;
let team = [];

// ========================================
// โหลดข้อมูล Pokémon
// ========================================

async function loadDashboard() {
    try {
        const response = await fetch("/pokemons");

        if (!response.ok) {
            throw new Error("โหลด Pokémon ไม่สำเร็จ");
        }

        allPokemons = await response.json();
        displayedPokemons = [...allPokemons];

        renderPokemons(displayedPokemons);

    } catch (error) {
        console.error(error);

        document.getElementById("pokemonGrid").innerHTML = `
            <div class="empty">
                โหลดข้อมูลไม่สำเร็จ<br>
                กรุณาตรวจสอบ server.js
            </div>
        `;
    }
}

// ========================================
// แสดง Pokémon
// ========================================

function renderPokemons(pokemons) {

    const grid = document.getElementById("pokemonGrid");
    grid.innerHTML = "";

    if (pokemons.length === 0) {
        grid.innerHTML = `<div class="empty">ไม่พบ Pokémon</div>`;
        return;
    }

    pokemons.forEach(pokemon => {

        const card = document.createElement("div");
        card.className = "pokemon-card";

        const gradient = gradientForTypes(pokemon.types);

        card.innerHTML = `
            <div class="card-top" style="--card-bg: ${gradient}; background: ${gradient};">
                <img src="${pokemon.image}" alt="${pokemon.name}">
            </div>
            <div class="card-info">
                <div class="pokemon-id">#${pokemon.id}</div>
                <h3>${pokemon.name}</h3>
                <div>
                    ${(pokemon.types || [])
                        .map(type => `<span class="pokemon-type">${type}</span>`)
                        .join("")}
                </div>
            </div>
        `;

        card.onclick = function () {
            selectPokemon(pokemon);
        };

        grid.appendChild(card);
    });
}

// ========================================
// เลือก Pokémon
// ========================================

function selectPokemon(pokemon) {

    selectedPokemon = pokemon;

    const box = document.getElementById("selectedPokemon");
    const gradient = gradientForTypes(pokemon.types);
    box.style.setProperty("--card-bg", gradient);
    box.style.background = gradient;

    box.innerHTML = `
        <img src="${pokemon.image}" alt="${pokemon.name}">

        <div class="selected-info">
            <h2>#${pokemon.id} ${pokemon.name}</h2>

            <div>
                ${(pokemon.types || [])
                    .map(type => `<span class="pokemon-type">${type}</span>`)
                    .join("")}
            </div>

            <div class="stats">
                <div class="stat"><strong>HP</strong><span>${pokemon.hp}</span></div>
                <div class="stat"><strong>Attack</strong><span>${pokemon.attack}</span></div>
                <div class="stat"><strong>Defense</strong><span>${pokemon.defense}</span></div>
                <div class="stat"><strong>Sp. Attack</strong><span>${pokemon.specialAttack}</span></div>
                <div class="stat"><strong>Sp. Defense</strong><span>${pokemon.specialDefense}</span></div>
                <div class="stat"><strong>Speed</strong><span>${pokemon.speed}</span></div>
            </div>

            <button class="add-button" onclick="addToTeam()">+ เพิ่มเข้าทีม</button>
        </div>
    `;
}

// ========================================
// เพิ่มเข้าทีม
// ========================================

function addToTeam() {

    if (!selectedPokemon) {
        alert("กรุณาเลือก Pokémon ก่อน");
        return;
    }

    if (team.length >= 6) {
        alert("ทีมเต็มแล้ว สามารถมี Pokémon ได้สูงสุด 6 ตัว");
        return;
    }

    const alreadyInTeam = team.some(pokemon => pokemon.id === selectedPokemon.id);

    if (alreadyInTeam) {
        alert("Pokémon ตัวนี้อยู่ในทีมแล้ว");
        return;
    }

    team.push(selectedPokemon);

    renderTeam();
    updateTotalStats();
}

// ========================================
// แสดงทีม
// ========================================

function renderTeam() {

    const grid = document.getElementById("teamGrid");
    document.getElementById("teamCount").textContent = team.length;

    grid.innerHTML = "";

    if (team.length === 0) {
        grid.innerHTML = `<div class="empty">ยังไม่มี Pokémon ในทีม</div>`;
        return;
    }

    team.forEach(pokemon => {

        const card = document.createElement("div");
        card.className = "team-card";

        const gradient = gradientForTypes(pokemon.types);

        card.innerHTML = `
            <div class="card-top" style="--card-bg: ${gradient}; background: ${gradient};">
                <img src="${pokemon.image}" alt="${pokemon.name}">
            </div>
            <div class="card-info">
                <h4>${pokemon.name}</h4>
                <div class="pokemon-id">#${pokemon.id}</div>
                <button class="remove-button" onclick="removeFromTeam(${pokemon.id})">ลบ</button>
            </div>
        `;

        grid.appendChild(card);
    });
}

// ========================================
// ลบออกจากทีม
// ========================================

function removeFromTeam(id) {
    team = team.filter(pokemon => pokemon.id !== id);
    renderTeam();
    updateTotalStats();
}

// ========================================
// รวมค่าพลัง
// ========================================

function updateTotalStats() {

    let hp = 0, attack = 0, defense = 0, specialAttack = 0, specialDefense = 0, speed = 0;

    team.forEach(pokemon => {
        hp += Number(pokemon.hp) || 0;
        attack += Number(pokemon.attack) || 0;
        defense += Number(pokemon.defense) || 0;
        specialAttack += Number(pokemon.specialAttack) || 0;
        specialDefense += Number(pokemon.specialDefense) || 0;
        speed += Number(pokemon.speed) || 0;
    });

    document.getElementById("totalHp").textContent = hp;
    document.getElementById("totalAttack").textContent = attack;
    document.getElementById("totalDefense").textContent = defense;
    document.getElementById("totalSpecialAttack").textContent = specialAttack;
    document.getElementById("totalSpecialDefense").textContent = specialDefense;
    document.getElementById("totalSpeed").textContent = speed;
}

// ========================================
// ค้นหา + เลือกธาตุ
// ========================================

function filterPokemons() {

    const searchText = document.getElementById("searchInput").value.toLowerCase().trim();
    const selectedType = document.getElementById("typeSelect").value;

    displayedPokemons = allPokemons.filter(pokemon => {

        const matchName = pokemon.name.toLowerCase().includes(searchText);
        const types = pokemon.types || [];
        const matchType = selectedType === "all" || types.includes(selectedType);

        return matchName && matchType;
    });

    sortPokemons();
}

// ========================================
// เรียงตามค่าพลัง
// ========================================

function sortPokemons() {

    const stat = document.getElementById("statSelect").value;
    const order = document.getElementById("orderSelect").value;

    displayedPokemons.sort((a, b) => {
        const valueA = Number(a[stat]) || 0;
        const valueB = Number(b[stat]) || 0;

        if (order === "desc") {
            return valueB - valueA;
        }

        return valueA - valueB;
    });

    renderPokemons(displayedPokemons);
}

// ========================================
// ทีมที่บันทึกไว้ (4 ช่องตายตัว)
// ========================================

const TEAM_SLOT_COUNT = 4;

function getTeamSlots() {

    try {
        const raw = localStorage.getItem("pokemonTeamSlots");
        const data = raw ? JSON.parse(raw) : [];
        const slots = Array.isArray(data) ? data : [];

        while (slots.length < TEAM_SLOT_COUNT) {
            slots.push(null);
        }

        return slots.slice(0, TEAM_SLOT_COUNT);

    } catch (error) {
        console.error(error);
        return new Array(TEAM_SLOT_COUNT).fill(null);
    }
}

function renderTeamSlots() {

    const container = document.getElementById("teamSlots");
    const slots = getTeamSlots();

    container.innerHTML = "";

    slots.forEach((slot, index) => {

        const card = document.createElement("div");
        card.className = "team-slot-card";

        const hasTeam = Array.isArray(slot) && slot.length > 0;

        const thumbs = hasTeam
            ? slot.slice(0, 6).map(pokemon => `<img src="${pokemon.image}" alt="${pokemon.name}">`).join("")
            : `<div class="team-slot-empty">ว่าง</div>`;

        card.innerHTML = `
            <div class="team-slot-label">ทีม ${index + 1}</div>
            <div class="team-slot-thumbs">${thumbs}</div>
            <div class="team-slot-actions">
                <button class="save-button btn-sm" onclick="saveTeamToSlot(${index})">💾 บันทึกที่นี่</button>
                <button class="load-button btn-sm" onclick="loadTeamSlot(${index})" ${hasTeam ? "" : "disabled"}>📂 เลือก</button>
            </div>
        `;

        container.appendChild(card);
    });
}

function saveTeamToSlot(index) {

    if (team.length === 0) {
        alert("ยังไม่มี Pokémon ในทีมที่กำลังจัดอยู่");
        return;
    }

    const slots = getTeamSlots();
    const alreadyHasTeam = Array.isArray(slots[index]) && slots[index].length > 0;

    if (alreadyHasTeam) {
        const confirmOverwrite = confirm(`ทีม ${index + 1} มีข้อมูลอยู่แล้ว ต้องการเขียนทับหรือไม่?`);

        if (!confirmOverwrite) {
            return;
        }
    }

    slots[index] = [...team];
    localStorage.setItem("pokemonTeamSlots", JSON.stringify(slots));

    renderTeamSlots();
    alert(`บันทึกลงทีม ${index + 1} เรียบร้อยแล้ว 💾`);
}

function loadTeamSlot(index) {

    const slots = getTeamSlots();
    const slot = slots[index];

    if (!Array.isArray(slot) || slot.length === 0) {
        alert(`ทีม ${index + 1} ยังว่างอยู่`);
        return;
    }

    team = [...slot];

    renderTeam();
    updateTotalStats();

    alert(`โหลดทีม ${index + 1} เรียบร้อยแล้ว 📂`);
}

// ========================================
// ล้างทีม
// ========================================

function clearTeam() {

    if (team.length === 0) {
        alert("ตอนนี้ทีมว่างอยู่แล้ว");
        return;
    }

    const confirmClear = confirm("ต้องการล้าง Pokémon ในทีมทั้งหมดหรือไม่?");

    if (!confirmClear) {
        return;
    }

    team = [];

    renderTeam();
    updateTotalStats();
}

// ========================================
// ปุ่มเลื่อนขึ้นด้านบน
// ========================================

function scrollToTop() {
    window.scrollTo({ top: 0, behavior: "smooth" });
}

window.addEventListener("scroll", () => {
    const btn = document.getElementById("scrollTopBtn");

    if (window.scrollY > 400) {
        btn.classList.add("show");
    } else {
        btn.classList.remove("show");
    }
});

// ========================================
// เริ่มต้น
// ========================================

renderTeamSlots();
loadDashboard();

</script>
